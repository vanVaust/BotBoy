<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BotBoy — Control Center</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.8.0/Recharts.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg:         #0a0e14;
    --surface:    #0f1520;
    --surface2:   #141c2e;
    --border:     #1e2d4a;
    --border2:    #243658;
    --accent:     #4fc3f7;
    --accent2:    #81c784;
    --accent3:    #ffb74d;
    --accent4:    #ce93d8;
    --danger:     #ef5350;
    --text:       #cdd6f4;
    --dim:        #6b7fa3;
    --mono:       'IBM Plex Mono', monospace;
    --sans:       'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--dim); }

  /* ── Layout ── */
  .app { display: grid; grid-template-rows: 48px 1fr; height: 100vh; }

  /* ── Topbar ── */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    grid-row: 1;
    user-select: none;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .logo-mark {
    width: 28px; height: 28px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent4) 100%);
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
  }
  .logo-text { font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
  .logo-version { font-size: 10px; color: var(--dim); margin-left: 4px; }

  /* Tabs */
  .tabs { display: flex; gap: 2px; }
  .tab {
    padding: 6px 14px;
    font-size: 12px; font-weight: 500;
    color: var(--dim);
    cursor: pointer;
    border-radius: 5px;
    transition: background 0.15s, color 0.15s;
    border: none; background: none;
    font-family: var(--sans);
  }
  .tab:hover { background: rgba(255,255,255,0.05); color: var(--text); }
  .tab.active { background: rgba(79,195,247,0.12); color: var(--accent); }

  /* Status indicators */
  .status-indicators { display: flex; gap: 16px; align-items: center; }
  .indicator { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex-shrink: 0; }
  .dot.live { background: var(--accent2); box-shadow: 0 0 5px var(--accent2); animation: pulse 2s infinite; }
  .dot.warn { background: var(--accent3); }
  .dot.dead { background: var(--danger); }
  @keyframes pulse {
    0%, 100% { opacity: 1; } 50% { opacity: 0.4; }
  }

  /* ── Main area ── */
  .main { grid-row: 2; display: grid; grid-template-columns: 200px 1fr 260px; overflow: hidden; }

  /* ── Left nav ── */
  .leftnav {
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    overflow-y: auto;
    padding: 8px 0;
  }
  .nav-section {
    padding: 8px 12px 4px;
    font-size: 9.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--dim);
    font-family: var(--mono);
  }
  .nav-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    cursor: pointer;
    color: var(--dim); font-size: 12.5px;
    border-left: 2px solid transparent;
    transition: all 0.12s;
  }
  .nav-item:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .nav-item.active { color: var(--accent); border-left-color: var(--accent); background: rgba(79,195,247,0.06); }
  .nav-icon { font-size: 13px; width: 16px; text-align: center; }

  /* ── Center panel ── */
  .center { overflow-y: auto; padding: 0; display: flex; flex-direction: column; }

  /* ── Metric cards row ── */
  .metrics-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .metric-card {
    padding: 16px 18px;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .metric-card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 2px;
  }
  .metric-card.blue::before   { background: var(--accent); }
  .metric-card.green::before  { background: var(--accent2); }
  .metric-card.yellow::before { background: var(--accent3); }
  .metric-card.purple::before { background: var(--accent4); }
  .metric-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.8px; font-family: var(--mono); }
  .metric-value { font-size: 28px; font-weight: 600; margin: 4px 0 2px; font-family: var(--mono); }
  .metric-value.blue   { color: var(--accent); }
  .metric-value.green  { color: var(--accent2); }
  .metric-value.yellow { color: var(--accent3); }
  .metric-value.purple { color: var(--accent4); }
  .metric-sub { font-size: 10.5px; color: var(--dim); }

  /* ── Section headers inside center ── */
  .section-header {
    padding: 14px 18px 10px;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--dim);
    font-family: var(--mono);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface);
    flex-shrink: 0;
    position: sticky; top: 0; z-index: 5;
  }

  /* ── Terminal / console ── */
  .console-area { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  .console-output {
    flex: 1; overflow-y: auto;
    padding: 12px 18px;
    font-family: var(--mono); font-size: 12px;
    line-height: 1.7;
  }
  .console-line { margin-bottom: 2px; }
  .console-line.cmd  { color: var(--accent); }
  .console-line.cmd::before { content: '→ '; }
  .console-line.ok   { color: var(--text); }
  .console-line.err  { color: var(--danger); }
  .console-line.sys  { color: var(--dim); font-style: italic; }
  .console-line.ts   { color: var(--dim); font-size: 10px; }
  .console-input-row {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 18px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .console-prompt { color: var(--accent); font-family: var(--mono); font-size: 12px; flex-shrink: 0; }
  .console-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); font-family: var(--mono); font-size: 12.5px;
    caret-color: var(--accent);
  }
  .console-input::placeholder { color: var(--dim); }

  /* ── Memory grid ── */
  .memory-grid { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .memory-search-row {
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-shrink: 0;
  }
  .search-input {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border2);
    border-radius: 5px;
    padding: 7px 12px;
    color: var(--text);
    font-family: var(--sans); font-size: 12.5px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .memory-list { flex: 1; overflow-y: auto; }
  .memory-item {
    display: grid;
    grid-template-columns: 28px 1fr 80px;
    gap: 10px; align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(30,45,74,0.5);
    cursor: pointer;
    transition: background 0.1s;
  }
  .memory-item:hover { background: rgba(255,255,255,0.02); }
  .memory-id {
    font-family: var(--mono); font-size: 10px; color: var(--dim);
    text-align: center;
  }
  .memory-content { color: var(--text); font-size: 12.5px; line-height: 1.5; }
  .memory-ts { font-size: 10px; color: var(--dim); font-family: var(--mono); text-align: right; }
  .memory-empty { padding: 40px 18px; text-align: center; color: var(--dim); font-size: 12px; }

  /* ── Archetype visualizer ── */
  .archetype-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    padding: 16px 18px;
  }
  .archetype-card {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    cursor: default;
    transition: border-color 0.15s;
  }
  .archetype-card:hover { border-color: var(--border2); }
  .archetype-name {
    font-family: var(--mono); font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  .archetype-channels { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
  .channel-badge {
    font-size: 9.5px; padding: 2px 6px; border-radius: 3px;
    font-family: var(--mono); font-weight: 600; text-transform: uppercase;
  }
  .ch-haptic    { background: rgba(79,195,247,0.15); color: var(--accent); }
  .ch-visual    { background: rgba(129,199,132,0.15); color: var(--accent2); }
  .ch-gustatory { background: rgba(255,183,77,0.15); color: var(--accent3); }
  .ch-olfactory { background: rgba(206,147,216,0.15); color: var(--accent4); }
  .ch-auditory  { background: rgba(239,83,80,0.15); color: var(--danger); }
  .archetype-bar-track {
    height: 4px; background: var(--border);
    border-radius: 2px; overflow: hidden; margin-top: 6px;
  }
  .archetype-bar-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
  .archetype-usage { font-size: 10px; color: var(--dim); margin-top: 4px; }

  /* ── Skills table ── */
  .skills-table { flex: 1; overflow-y: auto; }
  .skill-row {
    display: grid; grid-template-columns: 1fr 80px 60px;
    align-items: center; padding: 10px 18px;
    border-bottom: 1px solid rgba(30,45,74,0.5);
    transition: background 0.1s;
  }
  .skill-row:hover { background: rgba(255,255,255,0.02); }
  .skill-name { font-family: var(--mono); font-size: 12px; color: var(--accent); }
  .skill-desc { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .skill-level {
    font-size: 10px; font-family: var(--mono);
    padding: 2px 7px; border-radius: 3px; text-align: center;
  }
  .level-BEGINNER     { background: rgba(129,199,132,0.15); color: var(--accent2); }
  .level-INTERMEDIATE { background: rgba(255,183,77,0.15); color: var(--accent3); }
  .level-ADVANCED     { background: rgba(239,83,80,0.15); color: var(--danger); }

  /* ── History table ── */
  .history-row {
    display: grid; grid-template-columns: 20px 1fr 70px 60px 50px;
    align-items: center; padding: 8px 18px;
    border-bottom: 1px solid rgba(30,45,74,0.5);
    font-family: var(--mono); font-size: 11px;
    transition: background 0.1s;
  }
  .history-row:hover { background: rgba(255,255,255,0.02); }
  .h-status { text-align: center; }
  .h-cmd { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-type {
    padding: 1px 5px; border-radius: 3px; font-size: 9.5px;
    text-align: center;
  }
  .h-lat { color: var(--dim); text-align: right; }
  .h-ts  { color: var(--dim); text-align: right; }

  /* ── Right panel ── */
  .rightpanel {
    border-left: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .rp-section { padding: 12px 14px 8px; }
  .rp-title {
    font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 1px; color: var(--dim); font-family: var(--mono);
    margin-bottom: 10px;
  }
  .rp-divider { height: 1px; background: var(--border); margin: 4px 0; }

  /* Stat rows */
  .stat-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 0;
  }
  .stat-label { font-size: 11px; color: var(--dim); }
  .stat-value { font-size: 11px; font-family: var(--mono); color: var(--text); }
  .stat-value.good { color: var(--accent2); }
  .stat-value.warn { color: var(--accent3); }
  .stat-value.bad  { color: var(--danger); }

  /* Channel activity bars */
  .channel-item { margin-bottom: 8px; }
  .channel-row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 3px;
  }
  .channel-name { font-size: 10.5px; color: var(--dim); font-family: var(--mono); }
  .channel-count { font-size: 10px; color: var(--text); font-family: var(--mono); }
  .channel-track {
    height: 3px; background: var(--border); border-radius: 2px; overflow: hidden;
  }
  .channel-fill { height: 100%; border-radius: 2px; transition: width 0.5s; }

  /* Memory store button */
  .store-form { margin-top: 8px; }
  .store-textarea {
    width: 100%; height: 64px;
    background: var(--bg); border: 1px solid var(--border2);
    border-radius: 5px; padding: 8px 10px;
    color: var(--text); font-family: var(--sans); font-size: 11.5px;
    resize: none; outline: none;
    transition: border-color 0.15s;
  }
  .store-textarea:focus { border-color: var(--accent); }
  .store-btn {
    width: 100%; margin-top: 6px;
    background: rgba(79,195,247,0.15);
    border: 1px solid rgba(79,195,247,0.3);
    border-radius: 5px; padding: 6px;
    color: var(--accent); font-size: 11.5px; font-weight: 600;
    cursor: pointer; transition: background 0.15s;
    font-family: var(--sans);
  }
  .store-btn:hover { background: rgba(79,195,247,0.25); }

  /* ── Animations ── */
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }
  .fade-in { animation: fadeIn 0.2s ease; }

  /* ── Tooltip ── */
  .kbd {
    font-family: var(--mono); font-size: 10px;
    background: var(--border); border-radius: 3px;
    padding: 1px 5px; color: var(--dim);
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;
const { LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer } = Recharts;

const API = '';

// ── Data fetching ─────────────────────────────────────────────────────────────
async function apiFetch(path, opts = {}) {
  try {
    const r = await fetch(API + path, opts);
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function apiCmd(command) {
  return apiFetch('/api/command', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ command })
  });
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function ts() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
}
function reltime(isoStr) {
  if (!isoStr) return '—';
  const s = Math.floor((Date.now() - new Date(isoStr)) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}
function fmtMs(ms) {
  if (ms == null) return '—';
  return ms < 1 ? `${(ms*1000).toFixed(0)}µs` : `${ms.toFixed(1)}ms`;
}

// ── Channel colors ─────────────────────────────────────────────────────────────
const CH_COLORS = {
  haptic:    '#4fc3f7',
  visual:    '#81c784',
  gustatory: '#ffb74d',
  olfactory: '#ce93d8',
  auditory:  '#ef5350',
};

// ── ArchetypeCard ─────────────────────────────────────────────────────────────
function ArchetypeCard({ name, channels, useCount, successRate, maxCount }) {
  const COLOR = {
    INFORM: '#4fc3f7', ORGANIZE: '#81c784',
    COMMUNICATE: '#ffb74d', CREATE: '#ce93d8', ANALYZE: '#ef5350'
  };
  const pct = maxCount > 0 ? (useCount / maxCount) * 100 : 0;
  return (
    <div className="archetype-card fade-in">
      <div className="archetype-name" style={{ color: COLOR[name] }}>{name}</div>
      <div className="archetype-channels">
        {channels.map(ch => (
          <span key={ch} className={`channel-badge ch-${ch}`}>{ch.slice(0,3)}</span>
        ))}
      </div>
      <div className="archetype-bar-track">
        <div className="archetype-bar-fill"
          style={{ width: `${pct}%`, background: COLOR[name] }} />
      </div>
      <div className="archetype-usage">
        {useCount} uses · {Math.round((successRate||1)*100)}% success
      </div>
    </div>
  );
}

// ── Archetype channel map ──────────────────────────────────────────────────────
const ARCH_CHANNELS = {
  INFORM:      ['haptic','visual'],
  ORGANIZE:    ['haptic','gustatory'],
  COMMUNICATE: ['auditory','haptic'],
  CREATE:      ['haptic','gustatory'],
  ANALYZE:     ['visual','haptic','gustatory','olfactory'],
};

// ── ConsoleLine ──────────────────────────────────────────────────────────────
function ConsoleLine({ entry }) {
  const badgeColor = {
    calculate: '#ce93d8', memory: '#4fc3f7', skill: '#81c784',
    llm: '#ffb74d', error: '#ef5350', system: '#6b7fa3',
  };
  const bc = badgeColor[entry.type] || '#6b7fa3';
  return (
    <div style={{ marginBottom: 6 }}>
      <div className="console-line cmd">{entry.cmd}</div>
      {entry.output && (
        <div className="console-line ok" style={{ paddingLeft: 14, whiteSpace: 'pre-wrap', color: entry.success === false ? 'var(--danger)' : 'var(--text)' }}>
          {entry.type && (
            <span style={{ fontSize: 10, background: bc+'22', color: bc, padding: '1px 6px', borderRadius: 3, marginRight: 6, fontFamily: 'var(--mono)', fontWeight: 600 }}>
              {entry.type}
            </span>
          )}
          {entry.output.slice(0, 500)}
          {entry.output.length > 500 && <span style={{ color: 'var(--dim)' }}> …+{entry.output.length - 500}</span>}
        </div>
      )}
      <div className="console-line ts">{entry.ts}</div>
    </div>
  );
}

// ── App ───────────────────────────────────────────────────────────────────────
function App() {
  const [tab, setTab]       = useState('console');
  const [health, setHealth] = useState(null);
  const [metrics, setMetrics] = useState(null);
  const [memories, setMemories] = useState([]);
  const [memTotal, setMemTotal] = useState(0);
  const [memQuery, setMemQuery] = useState('');
  const [skills, setSkills]   = useState([]);
  const [history, setHistory] = useState([]);
  const [archetypes, setArchetypes] = useState([]);
  const [consoleLines, setConsoleLines] = useState([
    { cmd: '', output: 'BotBoy Control Center initialised. Type a command below.', type: 'system', ts: ts(), success: true }
  ]);
  const [cmdInput, setCmdInput] = useState('');
  const [memInput, setMemInput] = useState('');
  const [latHistory, setLatHistory] = useState([]);
  const [cmdHistory, setCmdHistory] = useState([]);
  const consoleRef = useRef(null);

  // ── Data refresh ──────────────────────────────────────────────────────────
  const refresh = useCallback(async () => {
    const [h, m] = await Promise.all([
      apiFetch('/health'),
      apiFetch('/api/metrics'),
    ]);
    if (h) setHealth(h);
    if (m) {
      setMetrics(m);
      setLatHistory(prev => [...prev.slice(-29), {
        t: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
        v: m.total_commands || 0
      }]);
    }
    // Archetype data
    const ar = await apiCmd('archetypes stats');
    if (ar?.success && ar.output) {
      // Parse archetype stats from output
      const lines = ar.output.split('\n').slice(1);
      const parsed = lines.map(l => {
        const m2 = l.match(/(\w+)\s+uses=\s*(\d+)\s+success=(\d+)%/);
        if (m2) return { name: m2[1].toUpperCase(), use_count: +m2[2], success_rate: +m2[3]/100 };
        return null;
      }).filter(Boolean);
      if (parsed.length > 0) setArchetypes(parsed);
    }
  }, []);

  const loadMemories = useCallback(async () => {
    const r = memQuery
      ? await apiFetch(`/api/memories/search?q=${encodeURIComponent(memQuery)}&limit=50`)
      : await apiFetch('/api/memories?limit=50&offset=0');
    if (r) {
      setMemories(memQuery ? (r.results || []) : (r.memories || []));
      if (!memQuery) setMemTotal(r.total || 0);
    }
  }, [memQuery]);

  const loadSkills = useCallback(async () => {
    const r = await apiFetch('/api/skills');
    if (r?.skills) setSkills(r.skills);
  }, []);

  const loadHistory = useCallback(async () => {
    const r = await apiFetch('/api/history?limit=30');
    if (r?.records) setHistory(r.records);
  }, []);

  useEffect(() => { refresh(); loadSkills(); loadHistory(); }, []);
  useEffect(() => { const id = setInterval(refresh, 5000); return () => clearInterval(id); }, [refresh]);
  useEffect(() => { if (tab === 'memory') loadMemories(); }, [tab, memQuery, loadMemories]);
  useEffect(() => { if (tab === 'history') loadHistory(); }, [tab]);

  useEffect(() => {
    if (consoleRef.current)
      consoleRef.current.scrollTop = consoleRef.current.scrollHeight;
  }, [consoleLines]);

  // ── Command execution ─────────────────────────────────────────────────────
  const execCmd = async (cmd) => {
    if (!cmd.trim()) return;
    const entry = { cmd, output: '…', type: '', ts: ts(), success: true };
    setConsoleLines(prev => [...prev, entry]);
    setCmdInput('');

    const t0 = performance.now();
    const r = await apiCmd(cmd);
    const lat = performance.now() - t0;

    if (r) {
      entry.output  = r.output || '';
      entry.type    = r.type || '';
      entry.success = r.success !== false;
      setCmdHistory(prev => [...prev.slice(-49), cmd]);
      setLatHistory(prev => [...prev.slice(-29), {
        t: new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}),
        lat: Math.round(lat)
      }]);
    } else {
      entry.output = 'No response from server.';
      entry.success = false;
    }
    setConsoleLines(prev => prev.map((l, i) => i === prev.length - 1 ? {...entry} : l));
    await loadHistory();
    await refresh();
  };

  const handleKeyDown = (e) => {
    if (e.key === 'Enter') { execCmd(cmdInput); return; }
    if (e.key === 'ArrowUp' && cmdHistory.length > 0) {
      setCmdInput(cmdHistory[cmdHistory.length - 1]);
    }
  };

  const storeMemory = async () => {
    if (!memInput.trim()) return;
    await apiCmd(`remember ${memInput}`);
    setMemInput('');
    await loadMemories();
    await refresh();
  };

  // ── Derived metrics ───────────────────────────────────────────────────────
  const totalCmds    = metrics?.total_commands ?? 0;
  const cacheHitRate = metrics ? Math.round((metrics.cache_hit_rate || 0) * 100) : 0;
  const memCount     = memTotal;
  const avgLat       = latHistory.length > 0
    ? Math.round(latHistory.filter(l => l.lat != null).reduce((s, l) => s + (l.lat||0), 0) / latHistory.filter(l=>l.lat).length || 0)
    : 0;
  const maxArch = archetypes.reduce((m, a) => Math.max(m, a.use_count), 1);

  const apiOk = health?.status === 'healthy';
  const memOk = health?.components?.memory;
  const llmOk = health?.components?.llm;

  return (
    <div className="app">
      {/* ── Topbar ── */}
      <div className="topbar">
        <div className="topbar-left">
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div className="logo-mark">🤖</div>
            <span className="logo-text">BotBoy<span className="logo-version"> v0.6</span></span>
          </div>
          <div className="tabs">
            {[['console','⚡ Console'],['memory','🧠 Memory'],['archetypes','🧩 Intent'],['skills','🔧 Skills'],['history','📜 History']].map(([id, label]) => (
              <button key={id} className={`tab ${tab===id?'active':''}`} onClick={() => setTab(id)}>{label}</button>
            ))}
          </div>
        </div>
        <div className="status-indicators">
          <div className="indicator"><div className={`dot ${apiOk?'live':'dead'}`}/> API</div>
          <div className="indicator"><div className={`dot ${memOk?'live':'dead'}`}/> Memory</div>
          <div className="indicator"><div className={`dot ${llmOk?'live':'warn'}`}/> LLM</div>
          <div style={{ fontSize: 11, color: 'var(--dim)', fontFamily: 'var(--mono)' }}>
            {new Date().toLocaleTimeString()}
          </div>
        </div>
      </div>

      {/* ── Main ── */}
      <div className="main">
        {/* Left nav */}
        <nav className="leftnav">
          <div className="nav-section">Navigate</div>
          {[
            ['console','⚡','Command Console'],['memory','🧠','Memory Store'],
            ['archetypes','🧩','Intent Engine'],['skills','🔧','Skill Catalog'],
            ['history','📜','Command History'],
          ].map(([id, icon, label]) => (
            <div key={id} className={`nav-item ${tab===id?'active':''}`} onClick={() => setTab(id)}>
              <span className="nav-icon">{icon}</span>{label}
            </div>
          ))}
          <div className="nav-section" style={{ marginTop: 12 }}>Quick Commands</div>
          {['status','performance','skills','schedule list','history stats','archetypes stats'].map(cmd => (
            <div key={cmd} className="nav-item" onClick={() => { setTab('console'); execCmd(cmd); }}>
              <span className="nav-icon">›</span>
              <span style={{ fontSize: 11.5, fontFamily: 'var(--mono)' }}>{cmd}</span>
            </div>
          ))}
        </nav>

        {/* Center */}
        <div className="center">
          {/* ── Metric cards (always visible) ── */}
          <div className="metrics-row">
            <div className="metric-card blue">
              <div className="metric-label">Commands</div>
              <div className="metric-value blue">{totalCmds.toLocaleString()}</div>
              <div className="metric-sub">total processed</div>
            </div>
            <div className="metric-card green">
              <div className="metric-label">Cache</div>
              <div className="metric-value green">{cacheHitRate}%</div>
              <div className="metric-sub">hit rate</div>
            </div>
            <div className="metric-card yellow">
              <div className="metric-label">Memories</div>
              <div className="metric-value yellow">{memCount.toLocaleString()}</div>
              <div className="metric-sub">stored items</div>
            </div>
            <div className="metric-card purple">
              <div className="metric-label">Latency</div>
              <div className="metric-value purple">{avgLat > 0 ? avgLat+'ms' : '—'}</div>
              <div className="metric-sub">avg this session</div>
            </div>
          </div>

          {/* ── Console tab ── */}
          {tab === 'console' && (
            <div className="console-area fade-in">
              <div className="section-header">
                <span>BotBoy REPL</span>
                <span className="kbd">↑ history</span>
              </div>
              <div className="console-output" ref={consoleRef}>
                {consoleLines.map((entry, i) => <ConsoleLine key={i} entry={entry} />)}
              </div>
              <div className="console-input-row">
                <span className="console-prompt">BotBoy›</span>
                <input
                  className="console-input"
                  value={cmdInput}
                  onChange={e => setCmdInput(e.target.value)}
                  onKeyDown={handleKeyDown}
                  placeholder="calculate pi * 2   |   remember …   |   search …   |   help"
                  autoFocus
                />
              </div>
            </div>
          )}

          {/* ── Memory tab ── */}
          {tab === 'memory' && (
            <div className="memory-grid fade-in">
              <div className="section-header">
                <span>Memory Store — {memTotal} entries</span>
              </div>
              <div className="memory-search-row">
                <input
                  className="search-input"
                  placeholder="Search memories (FTS5 BM25)…"
                  value={memQuery}
                  onChange={e => setMemQuery(e.target.value)}
                />
              </div>
              <div className="memory-list">
                {memories.length === 0 && (
                  <div className="memory-empty">
                    {memQuery ? `No results for "${memQuery}"` : 'No memories stored yet.'}
                  </div>
                )}
                {memories.map(m => (
                  <div key={m.id} className="memory-item">
                    <div className="memory-id">#{m.id}</div>
                    <div className="memory-content">{m.content}</div>
                    <div className="memory-ts">{reltime(m.timestamp)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* ── Archetypes tab ── */}
          {tab === 'archetypes' && (
            <div className="fade-in" style={{ flex: 1, overflow: 'auto' }}>
              <div className="section-header">
                <span>Behavioral Archetype Engine</span>
                <span style={{ color: 'var(--dim)', fontSize: 11 }}>
                  {archetypes.reduce((s, a) => s + a.use_count, 0)} commands classified
                </span>
              </div>
              <div className="archetype-grid">
                {archetypes.length > 0 ? archetypes.map(a => (
                  <ArchetypeCard
                    key={a.name}
                    name={a.name}
                    channels={ARCH_CHANNELS[a.name] || []}
                    useCount={a.use_count}
                    successRate={a.success_rate}
                    maxCount={maxArch}
                  />
                )) : (
                  ['INFORM','ORGANIZE','COMMUNICATE','CREATE','ANALYZE'].map(name => (
                    <ArchetypeCard key={name} name={name}
                      channels={ARCH_CHANNELS[name]||[]}
                      useCount={0} successRate={1} maxCount={1} />
                  ))
                )}
              </div>
              {/* Channel legend */}
              <div style={{ padding: '0 18px 16px' }}>
                <div style={{ fontSize: 10, color: 'var(--dim)', fontFamily: 'var(--mono)', marginBottom: 10, textTransform: 'uppercase', letterSpacing: '0.8px' }}>
                  Five-Channel Architecture
                </div>
                <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                  {Object.entries(CH_COLORS).map(([name, color]) => (
                    <div key={name} style={{ display: 'flex', alignItems: 'center', gap: 5, fontSize: 11 }}>
                      <div style={{ width: 10, height: 10, borderRadius: 2, background: color }} />
                      <span style={{ fontFamily: 'var(--mono)', color: 'var(--dim)' }}>{name}</span>
                    </div>
                  ))}
                </div>
              </div>
              {/* Latency chart */}
              {latHistory.filter(l => l.lat).length > 2 && (
                <div style={{ padding: '0 18px 20px' }}>
                  <div style={{ fontSize: 10, color: 'var(--dim)', fontFamily: 'var(--mono)', marginBottom: 10, textTransform: 'uppercase', letterSpacing: '0.8px' }}>
                    Session Latency (ms)
                  </div>
                  <ResponsiveContainer width="100%" height={80}>
                    <LineChart data={latHistory.filter(l => l.lat)}>
                      <Line type="monotone" dataKey="lat" stroke="var(--accent)" dot={false} strokeWidth={1.5} />
                      <XAxis dataKey="t" tick={{ fontSize: 9, fill: 'var(--dim)' }} axisLine={false} tickLine={false} />
                      <YAxis tick={{ fontSize: 9, fill: 'var(--dim)' }} axisLine={false} tickLine={false} width={30} />
                      <Tooltip contentStyle={{ background: 'var(--surface2)', border: '1px solid var(--border)', borderRadius: 5, fontSize: 11, fontFamily: 'var(--mono)' }} />
                    </LineChart>
                  </ResponsiveContainer>
                </div>
              )}
            </div>
          )}

          {/* ── Skills tab ── */}
          {tab === 'skills' && (
            <div className="fade-in" style={{ flex: 1, overflow: 'auto' }}>
              <div className="section-header">
                <span>Skill Catalog</span>
                <span style={{ color: 'var(--dim)', fontSize: 11 }}>{skills.length} skills loaded</span>
              </div>
              <div className="skills-table">
                {skills.length === 0 && (
                  <div className="memory-empty">No skills loaded.</div>
                )}
                {skills.map(name => {
                  const META = {
                    calculator: ['AST-safe math expression evaluator', 'BEGINNER'],
                    hash_text:  ['MD5/SHA cryptographic hash', 'BEGINNER'],
                    base64_op:  ['Base64 encode/decode', 'BEGINNER'],
                    convert:    ['Unit conversion (length/weight/temp)', 'BEGINNER'],
                    weather:    ['Current weather via wttr.in', 'BEGINNER'],
                    web_search: ['DuckDuckGo instant answers', 'BEGINNER'],
                    file_search:['Glob file search (home dir)', 'BEGINNER'],
                    system_info:['Platform and runtime info', 'BEGINNER'],
                    time_date:  ['Current UTC and local time', 'BEGINNER'],
                  };
                  const [desc, level] = META[name] || ['Custom skill', 'BEGINNER'];
                  return (
                    <div key={name} className="skill-row"
                      onClick={() => { setTab('console'); execCmd(name.replace('_',' ').replace('_op','').split(' ')[0]); }}>
                      <div>
                        <div className="skill-name">{name}</div>
                        <div className="skill-desc">{desc}</div>
                      </div>
                      <div className={`skill-level level-${level}`}>{level}</div>
                      <div style={{ color: 'var(--dim)', fontSize: 11 }}>→</div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          {/* ── History tab ── */}
          {tab === 'history' && (
            <div className="fade-in" style={{ flex: 1, overflow: 'auto' }}>
              <div className="section-header">
                <span>Command History</span>
                <span style={{ color: 'var(--dim)', fontSize: 11 }}>last 30</span>
              </div>
              {/* Column headers */}
              <div className="history-row" style={{ color: 'var(--dim)', fontSize: 10, borderBottom: '1px solid var(--border2)' }}>
                <div>✓</div>
                <div>Command</div>
                <div>Type</div>
                <div>Latency</div>
                <div>Time</div>
              </div>
              {history.length === 0 && <div className="memory-empty">No history yet.</div>}
              {history.map(r => {
                const TYPE_COLOR = { calculate:'#ce93d8', memory:'#4fc3f7', skill:'#81c784', llm:'#ffb74d', error:'#ef5350' };
                const tc = TYPE_COLOR[r.cmd_type] || '#6b7fa3';
                return (
                  <div key={r.id} className="history-row"
                    onClick={() => { setTab('console'); setCmdInput(r.command); }}>
                    <div className="h-status" style={{ color: r.success ? 'var(--accent2)' : 'var(--danger)' }}>
                      {r.success ? '✓' : '✗'}
                    </div>
                    <div className="h-cmd">{r.command}</div>
                    <div className="h-type" style={{ background: tc+'22', color: tc }}>{r.cmd_type}</div>
                    <div className="h-lat">{fmtMs(r.latency_ms)}</div>
                    <div className="h-ts">{reltime(r.created_at)}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* ── Right panel ── */}
        <div className="rightpanel">
          <div className="rp-section">
            <div className="rp-title">System Health</div>
            {health && (
              <>
                {[
                  ['API',       health.status === 'healthy', ''],
                  ['Memory',    health.components?.memory, ''],
                  ['Cache',     health.components?.cache, ''],
                  ['Scheduler', health.components?.scheduler, ''],
                  ['History',   health.components?.history, ''],
                  ['LLM',       health.components?.llm, ''],
                  ['Router',    health.components?.router, ''],
                  ['Archetypes',health.components?.archetypes, ''],
                ].map(([label, ok]) => (
                  <div key={label} className="stat-row">
                    <span className="stat-label">{label}</span>
                    <span className={`stat-value ${ok ? 'good' : 'bad'}`}>{ok ? 'online' : 'offline'}</span>
                  </div>
                ))}
                {health.cache && (
                  <div className="stat-row">
                    <span className="stat-label">Cache size</span>
                    <span className="stat-value">{health.cache.size} / {health.cache.capacity || '?'}</span>
                  </div>
                )}
              </>
            )}
          </div>

          <div className="rp-divider" />

          <div className="rp-section">
            <div className="rp-title">Channel Activity</div>
            {Object.entries(CH_COLORS).map(([ch, color]) => {
              const count = 0; // Will be populated from metrics
              return (
                <div key={ch} className="channel-item">
                  <div className="channel-row">
                    <span className="channel-name">{ch}</span>
                    <span className="channel-count">{count}</span>
                  </div>
                  <div className="channel-track">
                    <div className="channel-fill" style={{ width: '30%', background: color }} />
                  </div>
                </div>
              );
            })}
          </div>

          <div className="rp-divider" />

          <div className="rp-section" style={{ flex: 1 }}>
            <div className="rp-title">Quick Store</div>
            <div className="store-form">
              <textarea
                className="store-textarea"
                placeholder="Store a memory…"
                value={memInput}
                onChange={e => setMemInput(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); storeMemory(); }}}
              />
              <button className="store-btn" onClick={storeMemory}>
                Store → Memory
              </button>
            </div>
          </div>

          <div className="rp-divider" />

          <div className="rp-section">
            <div className="rp-title">Mode</div>
            <div className="stat-row">
              <span className="stat-label">Engine</span>
              <span className="stat-value" style={{ fontFamily: 'var(--mono)', fontSize: 10 }}>
                {health?.mode || 'stdlib'}
              </span>
            </div>
            <div className="stat-row">
              <span className="stat-label">Version</span>
              <span className="stat-value" style={{ fontFamily: 'var(--mono)', fontSize: 10 }}>
                {health?.version || '0.6.0-dev'}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
