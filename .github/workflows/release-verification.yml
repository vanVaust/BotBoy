name: release-verification

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  release-verification:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build and standard runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools pyyaml
          python -m pip install ".[standard]"

      - name: Run release acceptance
        shell: pwsh
        run: |
          python -m botboy.release_acceptance full --python python --bootstrap-python python --outdir dist

      - name: Run release test suite
        shell: pwsh
        run: |
          python -m botboy.release_smoke -v
          python -m botboy evals --summary
          python -c "import sys, unittest; suite = unittest.defaultTestLoader.discover('tests'); result = unittest.TextTestRunner(verbosity=2).run(suite); sys.exit(1 if (not result.wasSuccessful() or result.skipped) else 0)"
