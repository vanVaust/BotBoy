name: release-verification

on:
  push:
    branches:
      - main
      - master
      - security/v5.1-foundation
  pull_request:

jobs:
  release-verification:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install build and standard runtime dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel setuptools pyyaml
          python -m pip install ".[standard]"

      - name: Run release acceptance
        shell: pwsh
        run: |
          python -m botboy.release_acceptance full --python python --bootstrap-python python --outdir dist

      - name: Run release test suite
        shell: pwsh
        run: |
          python -m unittest discover -s tests -v
